[package]
name = "gideon-flag-registry"
description = "Gideon community flag registry: anyone can flag a NEAR account as a scam or poisoning address. No owner, no admin."
version = "0.1.0"
edition = "2024"
resolver = "3"
rust-version = "1.95"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30"

[dev-dependencies]
near-sdk = { version = "5.30", features = ["unit-testing"] }
near-sandbox = "0.4"
near-api = "0.8"
cargo-near-build = "0.11"
tokio = { version = "1", features = ["full"] }
testresult = "0.4"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['cfg(near)']
