<!doctype html><html lang="en" data-shift="auto" data-theme="day"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gideon · account health</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="/brand/apple-touch-icon.png"><meta property="og:title" content="Gideon · account health"><meta property="og:description" content="Account health: who can act for this account. Gideon lists a NEAR account's keys and flags risky ones. Read-only."><meta property="og:image" content="/brand/og.png"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630"><meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#F2F0EB">
<link rel="preload" href="/fonts/archivo.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/jbm.woff2" as="font" type="font/woff2" crossorigin>
<script>
/* Runs before first paint: apply the saved shift so there is no flash. AUTO = Day from 06:00, Night Watch from 18:30 (device clock). */
(function(){var BG={day:"#F2F0EB",night:"#0C0B09",plan:"#10283F",signal:"#FFFFFF"},s="auto";
try{s=localStorage.getItem("gideon:shift")||"auto"}catch(e){}
if(!/^(day|night|plan|signal|auto)$/.test(s))s="auto";
var d=new Date(),m=d.getHours()*60+d.getMinutes(),t=s==="auto"?((m>=1110||m<360)?"night":"day"):s,r=document.documentElement;
r.setAttribute("data-shift",s);r.setAttribute("data-theme",t);
var mt=document.querySelector('meta[name="theme-color"]');if(mt)mt.setAttribute("content",BG[t]);})();
</script>
</head><body>
<div id="nav" data-on="Account health"></div>
<main class="wrap">
 <section class="shead"><div><span class="eyebrow"><span class="bar"></span><span class="lbl">Account health</span></span>
  <h1 class="h1" id="heading"></h1></div></section>
 <div class="sgrid">
  <div class="card sform crop">
   <form class="form" id="form" autocomplete="off">
    <label class="field"><span class="label">NEAR account</span><input class="input" id="acct" spellcheck="false" autocapitalize="off" placeholder="alice.near"></label>
    <button class="btn" id="go" type="submit">Check my account <span class="ar">→</span></button>
   </form>
   <p class="small" style="margin-top:14px" id="footnote"></p>
  </div>
  <section class="verdict" id="out"></section>
 </div>
 <div id="keys"></div>
 <div id="foot"></div>
</main>
<script type="module" src="/src/keys.ts"></script>
</body></html>
