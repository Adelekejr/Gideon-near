<script>
/* Applies the saved theme before first paint. Auto follows this device's light or dark setting. */
(function(){var BG={light:"#F5F3EE",dark:"#0E0E0C"},m="",s="";
try{m=localStorage.getItem("gideon:theme")||"";s=localStorage.getItem("gideon:shift")||""}catch(e){}

</script>
