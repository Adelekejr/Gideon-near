<script>
/* Runs before first paint: apply the saved shift so there is no flash. AUTO = Day from 06:00, Night Watch from 18:30 (device clock). */
(function(){var BG={day:"#F2F0EB",night:"#0C0B09",plan:"#10283F",signal:"#FFFFFF"},s="auto";
try{s=localStorage.getItem("gideon:shift")||"auto"}catch(e){}
if(!/^(day|night|plan|signal|auto)$/.test(s))s="auto";
var d=new Date(),m=d.getHours()*60+d.getMinutes(),t=s==="auto"?((m>=1110||m<360)?"night":"day"):s,r=document.documentElement;
r.setAttribute("data-shift",s);r.setAttribute("data-theme",t);
var mt=document.querySelector('meta[name="theme-color"]');if(mt)mt.setAttribute("content",BG[t]);})();
</script>
</head><body>
