<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Withdraw NEAR · demo exchange (local test page)</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{margin:0;font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;background:#f4f5f7;color:#1c1f24}
.bar{background:#fff;border-bottom:1px solid #e3e5e8;padding:14px 28px;font-weight:700;display:flex;gap:24px}
.bar span{font-weight:400;color:#6b7280}
main{max-width:560px;margin:36px auto;background:#fff;border:1px solid #e3e5e8;border-radius:10px;padding:26px 28px 30px}
h1{font-size:20px;margin:0 0 4px}.sub{color:#6b7280;font-size:13px;margin:0 0 22px}
label{display:block;font-size:13px;font-weight:600;margin:16px 0 6px}
input,select{width:100%;box-sizing:border-box;height:42px;border:1px solid #cfd3d8;border-radius:6px;padding:0 12px;font:14px ui-monospace,Menlo,monospace;background:#fff}
select{font-family:inherit}
.row{display:flex;gap:12px}.row>div{flex:1}
button{margin-top:22px;width:100%;height:46px;border:0;border-radius:6px;background:#1f6feb;color:#fff;font-weight:700;font-size:15px;cursor:pointer}
button:disabled{background:#9aa4b2;cursor:not-allowed}
.copy{margin-top:26px;padding:12px;border:1px dashed #cfd3d8;border-radius:6px;font-size:13px;color:#6b7280}
.copy code{display:block;margin-top:6px;color:#1c1f24;font-size:12.5px;word-break:break-all}
#log{font:12px ui-monospace,monospace;color:#6b7280;margin-top:10px;min-height:1em}
</style></head>
<body>
<div class="bar">Demo Exchange <span>Markets</span><span>Trade</span><span>Wallet</span></div>
<main>
<h1>Withdraw NEAR</h1>
<p class="sub">Local test page for the Gideon extension. Nothing here sends anything.</p>
<form id="w" onsubmit="event.preventDefault();document.getElementById('log').textContent='(demo) withdraw submitted';">
<label for="coin">Coin</label>
<select id="coin"><option>NEAR</option></select>
<label for="addr">Withdrawal address</label>
<input id="addr" name="address" autocomplete="off" placeholder="Paste the recipient address">
<div class="row"><div><label for="net">Network</label><select id="net"><option>NEAR Protocol</option></select></div>
<div><label for="amt">Amount</label><input id="amt" name="amount" value="120"></div></div>
<button type="submit" id="send">Withdraw</button>
<div id="log"></div>
</form>
<div class="copy" id="copybox">Address to copy (test): <code id="src">hammed-stampdue.testnet</code></div>
</main>
<script>
// ?hijack=1 simulates clipboard-hijacking malware on the page: whatever you copy is replaced.
if (new URLSearchParams(location.search).get("hijack")) {
  document.addEventListener("copy", (e) => {
    e.clipboardData.setData("text/plain", "hammed-stampdue.testnet".replace("stampdue", "stampdve"));
    e.preventDefault();
  });
}
const src = new URLSearchParams(location.search).get("src");
if (src) document.getElementById("src").textContent = src;
</script>
</body></html>
